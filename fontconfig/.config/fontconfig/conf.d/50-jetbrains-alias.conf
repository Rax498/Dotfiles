<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The reference's configs ask for "JetBrains Mono Nerd Font" (with a space),
  but the font file it ships registers as "JetBrainsMono Nerd Font" (no space).
  On Arch the AUR package registers the spaced name. This alias maps one to the
  other so the reference's configs resolve without editing them.
-->
<fontconfig>
  <alias binding="strong">
    <family>JetBrains Mono Nerd Font</family>
    <accept><family>JetBrainsMono Nerd Font</family></accept>
  </alias>
  <alias binding="strong">
    <family>JetBrains Mono Nerd Font Mono</family>
    <accept><family>JetBrainsMono Nerd Font Mono</family></accept>
  </alias>
</fontconfig>
