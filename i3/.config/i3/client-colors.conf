# Window and tab-header colours. Joined after tinty's $base00..$base0F into colors.conf.
#
# state                  meaning
# focused                the focused window / tab
# focused_inactive       the visible tab in a container that is not focused
# unfocused              the other (hidden) tabs and windows
# urgent                 a window asking for attention
#
# class                  border   backgr.  text     indicator child_border
client.focused           $base0E  $base0E  $base00  $base0E   $base0E
client.focused_inactive  $base03  $base03  $base06  $base03   $base03
client.unfocused         $base02  $base02  $base04  $base02   $base02
client.urgent            $base0F  $base0F  $base00  $base0F   $base0F
client.placeholder       $base01  $base01  $base04  $base01   $base01
client.background        $base00
