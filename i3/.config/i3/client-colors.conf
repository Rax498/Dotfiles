# Window colours. Joined after tinty's $base00..$base0F into colors.conf.
# text = base05, inactive = base02, focused = base0E
# class                 border   backgr.  text     indicator child_border
client.focused          $base0E  $base0E  $base05  $base0E   $base0E
client.focused_inactive $base02  $base02  $base05  $base02   $base02
client.unfocused        $base02  $base02  $base05  $base02   $base02
client.urgent           $base02  $base02  $base05  $base02   $base02
client.placeholder      $base02  $base02  $base05  $base02   $base02
client.background       $base02
