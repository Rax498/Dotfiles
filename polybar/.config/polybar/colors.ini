; Names the bar uses -> tinty's palette (base16.ini, generated, gitignored).
; Polybar merges both files into one [colors] section.
[colors]
background = ${colors.base00}
foreground = ${colors.base05}
primary    = ${colors.base0E}
secondary  = ${colors.base0D}
alert      = ${colors.base08}
warn       = ${colors.base0A}
ok         = ${colors.base0B}
disabled   = ${colors.base04}
separator  = ${colors.base04}
