# Luna theme for lazygit, from https://github.com/WTFox/luna.nvim (extras/lazygit/luna.yml).
# Left out its git.diffRenderers block: it needs difftastic (difft), which is not installed.

gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#75a1c7"
      - bold
    inactiveBorderColor:
      - "#404040"
    optionsTextColor:
      - "#75a1c7"
    selectedLineBgColor:
      - "#212121"
    selectedRangeBgColor:
      - "#212121"
    cherryPickedCommitBgColor:
      - "#c4a8d6"
    cherryPickedCommitFgColor:
      - "#75a1c7"
    unstagedChangesColor:
      - "#e08585"
    defaultFgColor:
      - "#e4e4e8"
    searchingActiveBorderColor:
      - "#d9a35a"
      - bold
