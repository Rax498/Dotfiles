# alacritty 0.13.2 uses top-level `import`; the reference targets 0.14+
# where it moved under [general].
import = ["~/.config/alacritty/colors.toml"]  # generated by tinty

[window]
padding.x = 2
padding.y = 2
dynamic_padding = false
decorations = "full"
opacity = 0.90

[font]
size = 10.0

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[cursor]
style = "Block"
